name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./prisma/ci.db
      JWT_SECRET: ci-jwt-secret-not-for-production
      KIRVANO_WEBHOOK_SECRET: ci-kirvano-webhook-secret
      NODE_ENV: test
      TZ: America/Sao_Paulo
      RECEITAWS_TIMEOUT_MS: "2000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations (isolated SQLite)
        run: npx prisma migrate deploy

      - name: Run Jest suite
        run: npm test -- --runInBand --forceExit

      - name: Reset DB and re-run suite
        run: |
          rm -f prisma/ci.db prisma/ci.db-journal prisma/ci.db-wal prisma/ci.db-shm
          npx prisma migrate deploy
          npm test -- --runInBand --forceExit

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: test
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest suite
        run: npm test -- --runInBand --forceExit

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
